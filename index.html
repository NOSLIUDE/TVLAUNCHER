<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Android TV IPTV Launcher - Xtream & M3U Parser</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --focus-color: #00bcd4;
            --text-color: #ffffff;
            --text-secondary: #b0b0b0;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
        }

        /* Sidebar / Perfis e Arquivos */
        .sidebar {
            width: 320px;
            background-color: #181818;
            border-right: 2px solid #2a2a2a;
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
        }

        .sidebar h2 {
            font-size: 20px;
            margin-bottom: 15px;
            color: var(--focus-color);
        }

        .profile-list, .channel-list {
            list-style: none;
            padding: 0;
            margin: 0;
            overflow-y: auto;
            flex-grow: 1;
        }

        .item {
            padding: 12px 15px;
            margin-bottom: 8px;
            background-color: var(--card-bg);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.15s ease;
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            border: 2px solid transparent;
        }

        /* Foco Universal para Controle Remoto (DPAD) */
        .item:focus, .tab-item:focus {
            outline: none !important;
            border-color: var(--focus-color) !important;
            background-color: #2c2c2c !important;
            box-shadow: 0 0 10px rgba(0, 188, 212, 0.5);
            transform: scale(1.03);
        }

        /* Conteúdo Principal */
        .main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            padding: 25px;
            box-sizing: border-box;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        /* Abas de Categorias */
        #categoryTabs {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 15px;
            white-space: nowrap;
        }

        .tab-item {
            background-color: var(--card-bg);
            color: var(--text-secondary);
            border: 2px solid transparent;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }

        .tab-item.active {
            color: #fff;
            border-color: var(--focus-color);
        }

        .content-grid {
            display: flex;
            gap: 20px;
            flex-grow: 1;
            height: calc(100vh - 150px);
        }

        .channels-container {
            width: 350px;
            display: flex;
            flex-direction: column;
        }

        .player-container {
            flex-grow: 1;
            background-color: #000;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            border: 2px solid #2a2a2a;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .placeholder-text {
            color: var(--text-secondary);
            font-size: 18px;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>

    <!-- Barra Lateral: Carregamento de Lista M3U ou TXT -->
    <div class="sidebar">
        <h2>TV Launcher</h2>
        <div style="margin-bottom: 15px;">
            <input type="file" id="fileLoader" accept=".txt,.m3u" style="display: none;" onchange="handleFileSelect(event)">
            <button class="item" style="width: 100%; text-align: center; background-color: var(--focus-color); color: #000; font-weight: bold;" onclick="document.getElementById('fileLoader').click()" tabindex="0">Carregar Arquivo TXT / M3U</button>
        </div>
        <div style="font-size: 12px; color: var(--text-secondary); margin-bottom: 10px;">Perfis de Listas Carregadas:</div>
        <ul id="profileList" class="profile-list">
            <li class="item" tabindex="0">Nenhum perfil ativo</li>
        </ul>
    </div>

    <!-- Conteúdo Principal -->
    <div class="main-content">
        <div class="header">
            <h1 id="currentProfileTitle" style="margin: 0; font-size: 22px;">Selecione ou carregue uma lista</h1>
        </div>

        <!-- Abas de Categorias -->
        <div id="categoryTabs">
            <button class="tab-item active" tabindex="0">Todas</button>
        </div>

        <div class="content-grid">
            <!-- Lista de Canais -->
            <div class="channels-container">
                <ul id="channelList" class="channel-list">
                    <li class="item" tabindex="0">Aguardando seleção de perfil...</li>
                </ul>
            </div>

            <!-- Player de Vídeo -->
            <div class="player-container">
                <div id="placeholder" class="placeholder-text">Selecione um canal para iniciar a transmissão</div>
                <video id="tvPlayer" controls style="display: none;"></video>
            </div>
        </div>
    </div>

    <script>
        let profiles = [];
        let allChannels = [];
        let groupedData = {};
        let activeCategory = "Todas";

        // 1. Processador Geral de Arquivos TXT / M3U
        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const rawContent = e.target.result;
                parseTxtContent(rawContent, file.name);
            };
            reader.readAsText(file);
        }

        // 2. Parser inteligente de conteúdo TXT (Xtream / M3U / Links Diretos)
        function parseTxtContent(content, fileName) {
            const lines = content.split(/\r?\n/);
            profiles = [];
            let isM3u = content.includes('#EXTINF');

            if (isM3u) {
                // Caso seja formato M3U padrão
                allChannels = parseM3U(content);
                profiles.push({
                    name: fileName,
                    type: 'm3u',
                    channels: allChannels
                });
                renderProfiles();
                selectProfile(0);
                return;
            }

            // Caso seja um TXT com credenciais Xtream em texto puro ou URLs
            let profileCount = 1;
            lines.forEach(line => {
                line = line.trim();
                if (!line || line.startsWith('#')) return;

                let xtreamMatch = parseXtreamLine(line);
                if (xtreamMatch) {
                    profiles.push({
                        name: `Xtream Profile ${profileCount} (${xtreamMatch.host})`,
                        type: 'xtream',
                        server: xtreamMatch.server,
                        user: xtreamMatch.user,
                        pass: xtreamMatch.pass
                    });
                    profileCount++;
                } else if (line.startsWith('http')) {
                    // Lista M3U via URL remota
                    profiles.push({
                        name: `URL M3U ${profileCount}`,
                        type: 'm3u_url',
                        url: line
                    });
                    profileCount++;
                }
            });

            if (profiles.length === 0) {
                alert("Nenhuma credencial Xtream válida ou link M3U encontrado no arquivo TXT.");
                return;
            }

            renderProfiles();
            selectProfile(0); // Seleciona o primeiro perfil por padrão
        }

        // 3. Identificador de Formatos Xtream Codes em Texto Puro
        function parseXtreamLine(line) {
            // Suporta Formato 1: http://servidor.com:8080/get.php?username=USER&password=PASS
            // Suporta Formato 2: http://servidor.com:8080/live/USER/PASS/1.ts
            // Suporta Formato 3: http://servidor.com:8080|USER|PASS
            // Suporta Formato 4: http://servidor.com:8080 / USER / PASS (Com espaços ou barras)

            if (line.includes('|')) {
                let parts = line.split('|');
                if (parts.length >= 3) {
                    return { server: parts[0].trim(), user: parts[1].trim(), pass: parts[2].trim(), host: cleanHost(parts[0]) };
                }
            }

            if (line.includes('username=') && line.includes('password=')) {
                try {
                    let urlObj = new URL(line);
                    let server = `${urlObj.protocol}//${urlObj.host}`;
                    let user = urlObj.searchParams.get('username');
                    let pass = urlObj.searchParams.get('password');
                    if (user && pass) {
                        return { server, user, pass, host: urlObj.host };
                    }
                } catch (e) {}
            }

            // Expressão Regular para pegar links no formato: http://servidor.com:8080/user/pass ou /live/user/pass
            let regex = /(https?:\/\/[^\/]+)\/(?:live\/)?([^\/]+)\/([^\/\s]+)/;
            let match = line.match(regex);
            if (match) {
                return {
                    server: match[1],
                    user: match[2],
                    pass: match[3],
                    host: cleanHost(match[1])
                };
            }

            return null;
        }

        function cleanHost(url) {
            return url.replace('http://', '').replace('https://', '').split(':')[0];
        }

        // 4. Renderizar Perfis Encontrados
        function renderProfiles() {
            const profileListEl = document.getElementById('profileList');
            profileListEl.innerHTML = '';

            profiles.forEach((profile, index) => {
                let li = document.createElement('li');
                li.className = 'item';
                li.tabIndex = 0;
                li.innerText = `👤 ${profile.name}`;
                li.onclick = () => selectProfile(index);
                profileListEl.appendChild(li);
            });
        }

        // 5. Selecionar Perfil e Carregar Conteúdo (API Xtream ou Canais)
        async function selectProfile(index) {
            const profile = profiles[index];
            document.getElementById('currentProfileTitle').innerText = profile.name;
            document.getElementById('channelList').innerHTML = '<li class="item" tabindex="0">Carregando dados da API...</li>';

            if (profile.type === 'xtream') {
                await fetchXtreamChannels(profile);
            } else if (profile.type === 'm3u') {
                allChannels = profile.channels;
                processChannelsData();
            } else if (profile.type === 'm3u_url') {
                try {
                    let res = await fetch(profile.url);
                    let text = await res.text();
                    allChannels = parseM3U(text);
                    processChannelsData();
                } catch (err) {
                    alert("Erro ao buscar a lista M3U da URL.");
                }
            }
        }

        // 6. Chamada à API Nativa Xtream Codes (player_api.php)
        async function fetchXtreamChannels(profile) {
            const apiUrl = `${profile.server}/player_api.php?username=${profile.user}&password=${profile.pass}&action=get_live_streams`;
            try {
                let response = await fetch(apiUrl);
                let streams = await response.json();

                allChannels = streams.map(item => ({
                    name: item.name,
                    url: `${profile.server}/live/${profile.user}/${profile.pass}/${item.stream_id}.ts`,
                    group: item.category_name || "Canais Xtream",
                    logo: item.stream_icon
                }));

                processChannelsData();
            } catch (err) {
                console.error("Erro na API Xtream:", err);
                // Fallback: se a API player_api estiver desativada, tenta reproduzir o stream direto
                document.getElementById('channelList').innerHTML = '<li class="item" tabindex="0">Erro de conexão com o servidor Xtream.</li>';
            }
        }

        // 7. Organização de Canais e Categorias
        function processChannelsData() {
            groupedData = groupChannelsByCategory(allChannels);
            const categoryNames = Object.keys(groupedData);
            activeCategory = categoryNames[0] || "Todas";

            renderTabs(categoryNames);
            renderChannelsForCategory(activeCategory);
        }

        function groupChannelsByCategory(channels) {
            const categories = {};
            channels.forEach(channel => {
                const group = channel.group || "Geral";
                if (!categories[group]) categories[group] = [];
                categories[group].push(channel);
            });
            return categories;
        }

        function renderTabs(categories) {
            const tabsContainer = document.getElementById('categoryTabs');
            tabsContainer.innerHTML = '';

            categories.forEach(category => {
                let btn = document.createElement('button');
                btn.className = `tab-item ${category === activeCategory ? 'active' : ''}`;
                btn.innerText = `${category} (${groupedData[category].length})`;
                btn.tabIndex = 0;
                btn.onclick = () => {
                    activeCategory = category;
                    document.querySelectorAll('.tab-item').forEach(el => el.classList.remove('active'));
                    btn.classList.add('active');
                    renderChannelsForCategory(category);
                };
                tabsContainer.appendChild(btn);
            });
        }

        function renderChannelsForCategory(category) {
            const channelListEl = document.getElementById('channelList');
            channelListEl.innerHTML = '';

            const channels = groupedData[category] || [];
            if (channels.length === 0) {
                channelListEl.innerHTML = '<li class="item" tabindex="0">Nenhum canal nesta categoria</li>';
                return;
            }

            channels.forEach((channel) => {
                let li = document.createElement('li');
                li.className = 'item';
                li.tabIndex = 0;
                li.innerText = channel.name;
                li.onclick = () => playStream(channel.url);
                channelListEl.appendChild(li);
            });
        }

        // 8. Executar Vídeo no Player
        function playStream(url) {
            const video = document.getElementById('tvPlayer');
            const placeholder = document.getElementById('placeholder');

            placeholder.style.display = 'none';
            video.style.display = 'block';

            video.src = url;
            video.play().catch(err => {
                console.error("Erro ao reproduzir stream:", err);
                alert("O navegador da TV pode exigir a biblioteca HLS.js para reproduzir fluxos .ts ou .m3u8.");
            });
        }

        // 9. Parser de M3U Secundário
        function parseM3U(m3uContent) {
            const lines = m3uContent.split(/\r?\n/);
            const channels = [];
            let currentChannel = null;

            for (let i = 0; i < lines.length; i++) {
                let line = lines[i].trim();
                if (line.startsWith('#EXTINF:')) {
                    currentChannel = {};
                    const commaIndex = line.lastIndexOf(',');
                    currentChannel.name = commaIndex !== -1 ? line.substring(commaIndex + 1).trim() : "Canal Sem Nome";
                    const groupMatch = line.match(/group-title="([^"]*)"/);
                    currentChannel.group = groupMatch ? groupMatch[1] : 'Geral';
                } else if (line && !line.startsWith('#')) {
                    if (currentChannel) {
                        currentChannel.url = line;
                        channels.push(currentChannel);
                        currentChannel = null;
                    }
                }
            }
            return channels;
        }

        // 10. Navegação por Controle Remoto (DPAD / Setas)
        document.addEventListener('keydown', function(event) {
            const activeElement = document.activeElement;
            const key = event.key;

            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(key)) {
                event.preventDefault();

                // Foco nas Abas de Categorias (Horizontal)
                if (activeElement.classList.contains('tab-item')) {
                    if (key === 'ArrowRight' && activeElement.nextElementSibling) {
                        activeElement.nextElementSibling.focus();
                    } else if (key === 'ArrowLeft' && activeElement.previousElementSibling) {
                        activeElement.previousElementSibling.focus();
                    } else if (key === 'ArrowDown') {
                        const firstChannel = document.querySelector('#channelList .item');
                        if (firstChannel) firstChannel.focus();
                    }
                }
                // Foco na Lista de Canais (Vertical)
                else if (activeElement.classList.contains('item') && activeElement.closest('#channelList')) {
                    if (key === 'ArrowDown' && activeElement.nextElementSibling) {
                        activeElement.nextElementSibling.focus();
                    } else if (key === 'ArrowUp') {
                        if (activeElement.previousElementSibling) {
                            activeElement.previousElementSibling.focus();
                        } else {
                            const activeTab = document.querySelector('.tab-item.active') || document.querySelector('.tab-item');
                            if (activeTab) activeTab.focus();
                        }
                    } else if (key === 'ArrowLeft') {
                        const activeTab = document.querySelector('.tab-item.active') || document.querySelector('.tab-item');
                        if (activeTab) activeTab.focus();
                    }
                }
            }
        });
    </script>
</body>
</html>
