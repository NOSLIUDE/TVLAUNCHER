<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Android TV IPTV Launcher - Fix Parser</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --focus-color: #00bcd4;
            --text-color: #ffffff;
            --text-secondary: #b0b0b0;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
        }

        /* Sidebar / Perfis e Arquivos */
        .sidebar {
            width: 320px;
            background-color: #181818;
            border-right: 2px solid #2a2a2a;
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
        }

        .sidebar h2 {
            font-size: 20px;
            margin-bottom: 15px;
            color: var(--focus-color);
        }

        .profile-list, .channel-list {
            list-style: none;
            padding: 0;
            margin: 0;
            overflow-y: auto;
            flex-grow: 1;
        }

        .item {
            padding: 12px 15px;
            margin-bottom: 8px;
            background-color: var(--card-bg);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.15s ease;
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            border: 2px solid transparent;
        }

        /* Foco Universal para Controle Remoto (DPAD) */
        .item:focus, .tab-item:focus {
            outline: none !important;
            border-color: var(--focus-color) !important;
            background-color: #2c2c2c !important;
            box-shadow: 0 0 10px rgba(0, 188, 212, 0.5);
            transform: scale(1.03);
        }

        /* Conteúdo Principal */
        .main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            padding: 25px;
            box-sizing: border-box;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        /* Abas de Categorias */
        #categoryTabs {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 15px;
            white-space: nowrap;
        }

        .tab-item {
            background-color: var(--card-bg);
            color: var(--text-secondary);
            border: 2px solid transparent;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }

        .tab-item.active {
            color: #fff;
            border-color: var(--focus-color);
        }

        .content-grid {
            display: flex;
            gap: 20px;
            flex-grow: 1;
            height: calc(100vh - 150px);
        }

        .channels-container {
            width: 350px;
            display: flex;
            flex-direction: column;
        }

        .player-container {
            flex-grow: 1;
            background-color: #000;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            border: 2px solid #2a2a2a;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .placeholder-text {
            color: var(--text-secondary);
            font-size: 18px;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>

    <!-- Barra Lateral: Carregamento de Lista M3U ou TXT -->
    <div class="sidebar">
        <h2>TV Launcher</h2>
        <div style="margin-bottom: 15px;">
            <input type="file" id="fileLoader" accept=".txt,.m3u" style="display: none;" onchange="handleFileSelect(event)">
            <button class="item" style="width: 100%; text-align: center; background-color: var(--focus-color); color: #000; font-weight: bold;" onclick="document.getElementById('fileLoader').click()" tabindex="0">Carregar Arquivo TXT / M3U</button>
        </div>
        <div style="font-size: 12px; color: var(--text-secondary); margin-bottom: 10px;">Perfis de Listas Carregadas:</div>
        <ul id="profileList" class="profile-list">
            <li class="item" tabindex="0">Nenhum perfil ativo</li>
        </ul>
    </div>

    <!-- Conteúdo Principal -->
    <div class="main-content">
        <div class="header">
            <h1 id="currentProfileTitle" style="margin: 0; font-size: 22px;">Selecione ou carregue uma lista</h1>
        </div>

        <!-- Abas de Categorias -->
        <div id="categoryTabs">
            <button class="tab-item active" tabindex="0">Todas</button>
        </div>

        <div class="content-grid">
            <!-- Lista de Canais -->
            <div class="channels-container">
                <ul id="channelList" class="channel-list">
                    <li class="item" tabindex="0">Aguardando seleção de perfil...</li>
                </ul>
            </div>

            <!-- Player de Vídeo -->
            <div class="player-container">
                <div id="placeholder" class="placeholder-text">Selecione um canal para iniciar a transmissão</div>
                <video id="tvPlayer" controls style="display: none;"></video>
            </div>
        </div>
    </div>

    <script>
        let profiles = [];
        let allChannels = [];
        let groupedData = {};
        let activeCategory = "Todas";

        // 1. Leitor de Arquivo com Codificação UTF-8 Forçada
        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const rawContent = e.target.result;
                console.log("Arquivo carregado com sucesso. Tamanho:", rawContent.length);
                parseTxtContent(rawContent, file.name);
            };
            reader.readAsText(file, "UTF-8");
        }

        // 2. Parser Inteligente e Robusto
        function parseTxtContent(content, fileName) {
            const lines = content.split(/\r?\n/);
            profiles = [];
            let profileCount = 1;

            if (content.includes('#EXTINF')) {
                allChannels = parseM3U(content);
                profiles.push({
                    name: fileName,
                    type: 'm3u_direct',
                    channels: allChannels
                });
                renderProfiles();
                selectProfile(0);
                return;
            }

            lines.forEach((line, index) => {
                line = line.trim();
                if (!line || line.startsWith('#')) return;

                console.log(`Lendo linha ${index + 1}:`, line);

                // Detecta URL get.php ou player_api.php
                if ((line.includes('get.php') || line.includes('player_api.php')) && line.includes('username=') && line.includes('password=')) {
                    try {
                        let urlObj = new URL(line);
                        let server = `${urlObj.protocol}//${urlObj.host}`;
                        let user = urlObj.searchParams.get('username');
                        let pass = urlObj.searchParams.get('password');
                        
                        if (user && pass) {
                            profiles.push({
                                name: `Xtream [${profileCount}]`,
                                type: 'xtream_api',
                                server: server,
                                user: user,
                                pass: pass
                            });
                            profileCount++;
                            return;
                        }
                    } catch (e) {
                        console.error("Erro ao processar URL via objeto URL:", e);
                    }
                }

                // Detecta formato com barra vertical (Server|User|Pass)
                if (line.includes('|')) {
                    let parts = line.split('|');
                    if (parts.length >= 3) {
                        profiles.push({
                            name: `Xtream Pipe [${profileCount}]`,
                            type: 'xtream_api',
                            server: parts[0].trim().replace(/\/$/, ''),
                            user: parts[1].trim(),
                            pass: parts[2].trim()
                        });
                        profileCount++;
                        return;
                    }
                }

                // Fallback para URL HTTP genérica
                if (line.startsWith('http')) {
                    profiles.push({
                        name: `Lista URL [${profileCount}]`,
                        type: 'm3u_url',
                        url: line
                    });
                    profileCount++;
                }
            });

            console.log("Total de perfis gerados:", profiles.length);

            if (profiles.length === 0) {
                alert("O arquivo foi lido, mas nenhuma linha compatível com Xtream ou M3U foi identificada.");
                return;
            }

            renderProfiles();
            selectProfile(0);
        }

        // 3. Renderizar Perfis
        function renderProfiles() {
            const profileListEl = document.getElementById('profileList');
            profileListEl.innerHTML = '';

            profiles.forEach((profile, index) => {
                let li = document.createElement('li');
                li.className = 'item';
                li.tabIndex = 0;
                li.innerText = `👤 ${profile.name}`;
                li.onclick = () => selectProfile(index);
                profileListEl.appendChild(li);
            });
        }

        // 4. Selecionar Perfil e Disparar Requisição
        async function selectProfile(index) {
            const profile = profiles[index];
            document.getElementById('currentProfileTitle').innerText = profile.name;
            document.getElementById('channelList').innerHTML = '<li class="item" tabindex="0">Baixando canais do servidor...</li>';

            if (profile.type === 'xtream_api') {
                await fetchXtreamChannels(profile);
            } else if (profile.type === 'm3u_direct') {
                allChannels = profile.channels;
                processChannelsData();
            } else if (profile.type === 'm3u_url') {
                try {
                    let res = await fetch(profile.url);
                    let text = await res.text();
                    allChannels = parseM3U(text);
                    processChannelsData();
                } catch (err) {
                    console.error("Erro CORS ou de rede ao buscar URL:", err);
                    document.getElementById('channelList').innerHTML = '<li class="item" tabindex="0">Erro: Servidor bloqueou o acesso direto (CORS).</li>';
                }
            }
        }

        // 5. Consumir API Xtream Codes
        async function fetchXtreamChannels(profile) {
            const apiUrl = `${profile.server}/player_api.php?username=${profile.user}&password=${profile.pass}&action=get_live_streams`;
            console.log("Buscando API Xtream:", apiUrl);

            try {
                let response = await fetch(apiUrl);
                let streams = await response.json();

                if (!Array.isArray(streams)) {
                    throw new Error("A resposta da API não é uma lista de canais válida.");
                }

                allChannels = streams.map(item => ({
                    name: item.name,
                    url: `${profile.server}/live/${profile.user}/${profile.pass}/${item.stream_id}.ts`,
                    group: item.category_name || "Canais Xtream",
                    logo: item.stream_icon
                }));

                processChannelsData();
            } catch (err) {
                console.error("Erro na API Xtream:", err);
                document.getElementById('channelList').innerHTML = '<li class="item" tabindex="0">Erro ao conectar na API Xtream. Verifique o link.</li>';
            }
        }

        // 6. Organização de Canais e Categorias
        function processChannelsData() {
            groupedData = groupChannelsByCategory(allChannels);
            const categoryNames = Object.keys(groupedData);
            activeCategory = categoryNames[0] || "Todas";

            renderTabs(categoryNames);
            renderChannelsForCategory(activeCategory);
        }

        function groupChannelsByCategory(channels) {
            const categories = {};
            channels.forEach(channel => {
                const group = channel.group || "Geral";
                if (!categories[group]) categories[group] = [];
                categories[group].push(channel);
            });
            return categories;
        }

        function renderTabs(categories) {
            const tabsContainer = document.getElementById('categoryTabs');
            tabsContainer.innerHTML = '';

            categories.forEach(category => {
                let btn = document.createElement('button');
                btn.className = `tab-item ${category === activeCategory ? 'active' : ''}`;
                btn.innerText = `${category} (${groupedData[category].length})`;
                btn.tabIndex = 0;
                btn.onclick = () => {
                    activeCategory = category;
                    document.querySelectorAll('.tab-item').forEach(el => el.classList.remove('active'));
                    btn.classList.add('active');
                    renderChannelsForCategory(category);
                };
                tabsContainer.appendChild(btn);
            });
        }

        function renderChannelsForCategory(category) {
            const channelListEl = document.getElementById('channelList');
            channelListEl.innerHTML = '';

            const channels = groupedData[category] || [];
            if (channels.length === 0) {
                channelListEl.innerHTML = '<li class="item" tabindex="0">Nenhum canal nesta categoria</li>';
                return;
            }

            channels.forEach((channel) => {
                let li = document.createElement('li');
                li.className = 'item';
                li.tabIndex = 0;
                li.innerText = channel.name;
                li.onclick = () => playStream(channel.url);
                channelListEl.appendChild(li);
            });
        }

        // 7. Executar Vídeo no Player
        function playStream(url) {
            const video = document.getElementById('tvPlayer');
            const placeholder = document.getElementById('placeholder');

            placeholder.style.display = 'none';
            video.style.display = 'block';

            video.src = url;
            video.play().catch(err => {
                console.error("Erro ao reproduzir stream:", err);
                alert("O player do navegador não conseguiu reproduzir o formato do stream.");
            });
        }

        // 8. Parser M3U
        function parseM3U(m3uContent) {
            const lines = m3uContent.split(/\r?\n/);
            const channels = [];
            let currentChannel = null;

            for (let i = 0; i < lines.length; i++) {
                let line = lines[i].trim();
                if (line.startsWith('#EXTINF:')) {
                    currentChannel = {};
                    const commaIndex = line.lastIndexOf(',');
                    currentChannel.name = commaIndex !== -1 ? line.substring(commaIndex + 1).trim() : "Canal Sem Nome";
                    const groupMatch = line.match(/group-title="([^"]*)"/);
                    currentChannel.group = groupMatch ? groupMatch[1] : 'Geral';
                } else if (line && !line.startsWith('#')) {
                    if (currentChannel) {
                        currentChannel.url = line;
                        channels.push(currentChannel);
                        currentChannel = null;
                    }
                }
            }
            return channels;
        }

        // 9. Navegação por Controle Remoto (DPAD / Setas)
        document.addEventListener('keydown', function(event) {
            const activeElement = document.activeElement;
            const key = event.key;

            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(key)) {
                event.preventDefault();

                if (activeElement.classList.contains('tab-item')) {
                    if (key === 'ArrowRight' && activeElement.nextElementSibling) {
                        activeElement.nextElementSibling.focus();
                    } else if (key === 'ArrowLeft' && activeElement.previousElementSibling) {
                        activeElement.previousElementSibling.focus();
                    } else if (key === 'ArrowDown') {
                        const firstChannel = document.querySelector('#channelList .item');
                        if (firstChannel) firstChannel.focus();
                    }
                } else if (activeElement.classList.contains('item') && activeElement.closest('#channelList')) {
                    if (key === 'ArrowDown' && activeElement.nextElementSibling) {
                        activeElement.nextElementSibling.focus();
                    } else if (key === 'ArrowUp') {
                        if (activeElement.previousElementSibling) {
                            activeElement.previousElementSibling.focus();
                        } else {
                            const activeTab = document.querySelector('.tab-item.active') || document.querySelector('.tab-item');
                            if (activeTab) activeTab.focus();
                        }
                    } else if (key === 'ArrowLeft') {
                        const activeTab = document.querySelector('.tab-item.active') || document.querySelector('.tab-item');
                        if (activeTab) activeTab.focus();
                    }
                }
            }
        });
    </script>
</body>
</html>
