<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Android TV IPTV Launcher</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --focus-color: #00bcd4;
            --text-color: #ffffff;
            --text-secondary: #b0b0b0;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
        }

        /* Sidebar / Perfis e Arquivos */
        .sidebar {
            width: 300px;
            background-color: #181818;
            border-right: 2px solid #2a2a2a;
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
        }

        .sidebar h2 {
            font-size: 20px;
            margin-bottom: 20px;
            color: var(--focus-color);
        }

        .profile-list, .channel-list {
            list-style: none;
            padding: 0;
            margin: 0;
            overflow-y: auto;
            flex-grow: 1;
        }

        .item {
            padding: 12px 15px;
            margin-bottom: 8px;
            background-color: var(--card-bg);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.15s ease;
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            border: 2px solid transparent;
        }

        /* Foco Universal para Controle Remoto (DPAD) */
        .item:focus, .tab-item:focus {
            outline: none !important;
            border-color: var(--focus-color) !important;
            background-color: #2c2c2c !important;
            box-shadow: 0 0 10px rgba(0, 188, 212, 0.5);
            transform: scale(1.03);
        }

        /* Conteúdo Principal */
        .main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            padding: 30px;
            box-sizing: border-box;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        /* Abas de Categorias */
        #categoryTabs {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 15px;
            white-space: nowrap;
        }

        .tab-item {
            background-color: var(--card-bg);
            color: var(--text-secondary);
            border: 2px solid transparent;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }

        .tab-item.active {
            color: #fff;
            border-color: var(--focus-color);
        }

        .content-grid {
            display: flex;
            gap: 20px;
            flex-grow: 1;
            height: calc(100vh - 150px);
        }

        .channels-container {
            width: 350px;
            display: flex;
            flex-direction: column;
        }

        .player-container {
            flex-grow: 1;
            background-color: #000;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            border: 2px solid #2a2a2a;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .placeholder-text {
            color: var(--text-secondary);
            font-size: 18px;
        }
    </style>
</head>
<body>

    <!-- Barra Lateral: Carregamento de Lista M3U ou TXT -->
    <div class="sidebar">
        <h2>TV Launcher</h2>
        <div style="margin-bottom: 15px;">
            <input type="file" id="m3uFileLoader" accept=".m3u,.txt" style="display: none;" onchange="loadM3UFile(event)">
            <button class="item" style="width: 100%; text-align: center; background-color: var(--focus-color); color: #000; font-weight: bold;" onclick="document.getElementById('m3uFileLoader').click()" tabindex="0">Carregar Lista M3U / TXT</button>
        </div>
        <div style="font-size: 12px; color: var(--text-secondary); margin-bottom: 10px;">Perfis / Histórico:</div>
        <ul id="profileList" class="profile-list">
            <li class="item" tabindex="0">Nenhuma lista carregada</li>
        </ul>
    </div>

    <!-- Conteúdo Principal -->
    <div class="main-content">
        <div class="header">
            <h1 id="currentProfileTitle" style="margin: 0; font-size: 22px;">Aguardando Lista de Canais</h1>
        </div>

        <!-- Abas de Categorias -->
        <div id="categoryTabs">
            <button class="tab-item active" tabindex="0">Geral</button>
        </div>

        <div class="content-grid">
            <!-- Lista de Canais -->
            <div class="channels-container">
                <ul id="channelList" class="channel-list">
                    <li class="item" tabindex="0">Carregue um arquivo para exibir os canais...</li>
                </ul>
            </div>

            <!-- Player de Vídeo -->
            <div class="player-container">
                <div id="placeholder" class="placeholder-text">Selecione um canal para reproduzir</div>
                <video id="tvPlayer" controls style="display: none;"></video>
            </div>
        </div>
    </div>

    <script>
        let allChannels = [];
        let groupedData = {};
        let activeCategory = "Geral";

        // 1. Parser de Arquivo M3U / TXT Bruto
        function parseM3U(m3uContent) {
            const lines = m3uContent.split(/\r?\n/);
            const channels = [];
            let currentChannel = null;

            for (let i = 0; i < lines.length; i++) {
                let line = lines[i].trim();

                if (line.startsWith('#EXTINF:')) {
                    currentChannel = {};
                    const commaIndex = line.lastIndexOf(',');
                    currentChannel.name = commaIndex !== -1 ? line.substring(commaIndex + 1).trim() : "Canal Sem Nome";

                    const logoMatch = line.match(/tvg-logo="([^"]*)"/);
                    currentChannel.logo = logoMatch ? logoMatch[1] : '';

                    const groupMatch = line.match(/group-title="([^"]*)"/);
                    currentChannel.group = groupMatch ? groupMatch[1] : 'Geral';
                } else if (line && !line.startsWith('#')) {
                    if (currentChannel) {
                        currentChannel.url = line;
                        channels.push(currentChannel);
                        currentChannel = null;
                    } else if (line.startsWith('http')) {
                        // Caso seja um TXT simples apenas com URLs
                        channels.push({
                            name: `Canal ${channels.length + 1}`,
                            url: line,
                            group: 'Listas TXT'
                        });
                    }
                }
            }
            return channels;
        }

        // 2. Carregar e Processar Arquivo
        function loadM3UFile(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const rawContent = e.target.result;
                allChannels = parseM3U(rawContent);

                if (allChannels.length === 0) {
                    alert("Nenhum canal encontrado ou formato inválido.");
                    return;
                }

                document.getElementById('currentProfileTitle').innerText = file.name;
                
                // Atualiza perfil na barra lateral
                document.getElementById('profileList').innerHTML = `<li class="item" tabindex="0">📁 ${file.name} (${allChannels.length} canais)</li>`;

                // Agrupa e renderiza categorias
                groupedData = groupChannelsByCategory(allChannels);
                const categoryNames = Object.keys(groupedData);
                activeCategory = categoryNames[0] || "Geral";

                renderTabs(categoryNames);
                renderChannelsForCategory(activeCategory);
            };
            reader.readAsText(file);
        }

        // 3. Agrupar por Categorias
        function groupChannelsByCategory(channels) {
            const categories = {};
            channels.forEach(channel => {
                const group = channel.group || "Geral";
                if (!categories[group]) categories[group] = [];
                categories[group].push(channel);
            });
            return categories;
        }

        // 4. Renderizar Abas de Categorias
        function renderTabs(categories) {
            const tabsContainer = document.getElementById('categoryTabs');
            tabsContainer.innerHTML = '';

            categories.forEach(category => {
                let btn = document.createElement('button');
                btn.className = `tab-item ${category === activeCategory ? 'active' : ''}`;
                btn.innerText = `${category} (${groupedData[category].length})`;
                btn.tabIndex = 0;
                btn.onclick = () => {
                    activeCategory = category;
                    document.querySelectorAll('.tab-item').forEach(el => el.classList.remove('active'));
                    btn.classList.add('active');
                    renderChannelsForCategory(category);
                };
                tabsContainer.appendChild(btn);
            });
        }

        // 5. Renderizar Canais da Categoria Ativa
        function renderChannelsForCategory(category) {
            const channelListEl = document.getElementById('channelList');
            channelListEl.innerHTML = '';

            const channels = groupedData[category] || [];
            if (channels.length === 0) {
                channelListEl.innerHTML = '<li class="item" tabindex="0">Nenhum canal nesta categoria</li>';
                return;
            }

            channels.forEach((channel) => {
                let li = document.createElement('li');
                li.className = 'item';
                li.tabIndex = 0;
                li.innerText = channel.name;
                li.onclick = () => playStream(channel.url);
                channelListEl.appendChild(li);
            });
        }

        // 6. Executar Vídeo no Player
        function playStream(url) {
            const video = document.getElementById('tvPlayer');
            const placeholder = document.getElementById('placeholder');

            placeholder.style.display = 'none';
            video.style.display = 'block';

            video.src = url;
            video.play().catch(err => {
                console.error("Erro ao reproduzir stream:", err);
                alert("O navegador pode não suportar o formato de vídeo deste canal (ex: fluxos .ts puros sem extensão HLS).");
            });
        }

        // 7. Navegação por Controle Remoto (DPAD / Setas)
        document.addEventListener('keydown', function(event) {
            const activeElement = document.activeElement;
            const key = event.key;

            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(key)) {
                event.preventDefault();

                // Foco nas Abas de Categorias (Horizontal)
                if (activeElement.classList.contains('tab-item')) {
                    if (key === 'ArrowRight' && activeElement.nextElementSibling) {
                        activeElement.nextElementSibling.focus();
                    } else if (key === 'ArrowLeft' && activeElement.previousElementSibling) {
                        activeElement.previousElementSibling.focus();
                    } else if (key === 'ArrowDown') {
                        const firstChannel = document.querySelector('#channelList .item');
                        if (firstChannel) firstChannel.focus();
                    }
                }
                // Foco na Lista de Canais (Vertical)
                else if (activeElement.classList.contains('item') && activeElement.closest('#channelList')) {
                    if (key === 'ArrowDown' && activeElement.nextElementSibling) {
                        activeElement.nextElementSibling.focus();
                    } else if (key === 'ArrowUp') {
                        if (activeElement.previousElementSibling) {
                            activeElement.previousElementSibling.focus();
                        } else {
                            const activeTab = document.querySelector('.tab-item.active') || document.querySelector('.tab-item');
                            if (activeTab) activeTab.focus();
                        }
                    } else if (key === 'ArrowLeft') {
                        const activeTab = document.querySelector('.tab-item.active') || document.querySelector('.tab-item');
                        if (activeTab) activeTab.focus();
                    }
                }
            }
        });
    </script>
</body>
</html>
