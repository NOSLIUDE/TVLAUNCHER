<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Android TV IPTV Launcher - Entrada Manual & TXT</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --focus-color: #00bcd4;
            --text-color: #ffffff;
            --text-secondary: #b0b0b0;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
        }

        .sidebar {
            width: 330px;
            background-color: #181818;
            border-right: 2px solid #2a2a2a;
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
        }

        .sidebar h2 {
            font-size: 20px;
            margin-bottom: 15px;
            color: var(--focus-color);
        }

        .manual-input-box {
            background-color: var(--card-bg);
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
            border: 1px solid #333;
        }

        .manual-input-box label {
            font-size: 12px;
            color: var(--text-secondary);
            display: block;
            margin-bottom: 6px;
        }

        .manual-input-box input {
            width: 100%;
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #444;
            background-color: #121212;
            color: #fff;
            font-size: 13px;
            box-sizing: border-box;
            margin-bottom: 8px;
        }

        .manual-input-box input:focus {
            border-color: var(--focus-color);
            outline: none;
        }

        .profile-list, .channel-list {
            list-style: none;
            padding: 0;
            margin: 0;
            overflow-y: auto;
            flex-grow: 1;
        }

        .item {
            padding: 12px 15px;
            margin-bottom: 8px;
            background-color: var(--card-bg);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.15s ease;
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            border: 2px solid transparent;
        }

        .item:focus, .tab-item:focus, .btn-action:focus {
            outline: none !important;
            border-color: var(--focus-color) !important;
            background-color: #2c2c2c !important;
            box-shadow: 0 0 10px rgba(0, 188, 212, 0.5);
            transform: scale(1.02);
        }

        .btn-action {
            width: 100%;
            padding: 10px;
            background-color: var(--focus-color);
            color: #000;
            font-weight: bold;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }

        .main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            padding: 25px;
            box-sizing: border-box;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        #categoryTabs {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 15px;
            white-space: nowrap;
        }

        .tab-item {
            background-color: var(--card-bg);
            color: var(--text-secondary);
            border: 2px solid transparent;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }

        .tab-item.active {
            color: #fff;
            border-color: var(--focus-color);
        }

        .content-grid {
            display: flex;
            gap: 20px;
            flex-grow: 1;
            height: calc(100vh - 150px);
        }

        .channels-container {
            width: 350px;
            display: flex;
            flex-direction: column;
        }

        .player-container {
            flex-grow: 1;
            background-color: #000;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            border: 2px solid #2a2a2a;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .placeholder-text {
            color: var(--text-secondary);
            font-size: 18px;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>

    <!-- Sidebar com Importação de Arquivo e Entrada Manual -->
    <div class="sidebar">
        <h2>TV Launcher</h2>

        <!-- Opção 1: Entrada Manual de URL -->
        <div class="manual-input-box">
            <label>Adicionar Lista Manual (URL / get.php)</label>
            <input type="text" id="manualUrlInput" placeholder="Cole o link http://..." tabindex="0">
            <button class="btn-action" onclick="addManualUrl()" tabindex="0">Adicionar Lista</button>
        </div>

        <!-- Opção 2: Carregar Arquivo TXT -->
        <div style="margin-bottom: 15px;">
            <input type="file" id="fileLoader" accept=".txt,.m3u" style="display: none;" onchange="handleFileSelect(event)">
            <button class="item" style="width: 100%; text-align: center; background-color: #2a2a2a; color: #fff;" onclick="document.getElementById('fileLoader').click()" tabindex="0">📁 Carregar Arquivo TXT / M3U</button>
        </div>

        <div style="font-size: 12px; color: var(--text-secondary); margin-bottom: 10px;">Perfis de Listas:</div>
        <ul id="profileList" class="profile-list">
            <li class="item" tabindex="0">Nenhum perfil carregado</li>
        </ul>
    </div>

    <!-- Conteúdo Principal -->
    <div class="main-content">
        <div class="header">
            <h1 id="currentProfileTitle" style="margin: 0; font-size: 22px;">Insira um link ou carregue um arquivo</h1>
        </div>

        <div id="categoryTabs">
            <button class="tab-item active" tabindex="0">Todas</button>
        </div>

        <div class="content-grid">
            <div class="channels-container">
                <ul id="channelList" class="channel-list">
                    <li class="item" tabindex="0">Aguardando dados...</li>
                </ul>
            </div>

            <div class="player-container">
                <div id="placeholder" class="placeholder-text">Selecione um canal para reproduzir</div>
                <video id="tvPlayer" controls style="display: none;"></video>
            </div>
        </div>
    </div>

    <script>
        let profiles = [];
        let allChannels = [];
        let groupedData = {};
        let activeCategory = "Todas";

        // Adicionar URL colada manualmente
        function addManualUrl() {
            const input = document.getElementById('manualUrlInput');
            let rawUrl = input.value.trim();

            if (!rawUrl || !rawUrl.includes('http')) {
                alert("Por favor, insira um link válido começando com http:// ou https://");
                return;
            }

            // Limpa caracteres invisíveis
            let startIndex = rawUrl.indexOf('http');
            let cleanUrl = rawUrl.substring(startIndex).split(/\s+/)[0];

            const newProfileIndex = profiles.length;
            profiles.push({
                name: `Perfil Manual [${newProfileIndex + 1}]`,
                url: cleanUrl
            });

            input.value = '';
            renderProfiles();
            selectProfile(newProfileIndex);
        }

        // Carregar arquivo local .txt
        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const rawContent = e.target.result;
                parseTxtContent(rawContent, file.name);
            };
            reader.readAsText(file, "UTF-8");
        }

        // Processa o conteúdo do TXT de forma tolerante a falhas
        async function parseTxtContent(content, fileName) {
            const lines = content.replace(/^\uFEFF/, '').split(/\r?\n/);
            profiles = [];
            let profileCount = 1;

            for (let i = 0; i < lines.length; i++) {
                let line = lines[i].trim();
                if (!line || line.startsWith('#')) continue;

                if (line.includes('http')) {
                    let startIndex = line.indexOf('http');
                    let cleanUrl = line.substring(startIndex).split(/\s+/)[0];

                    profiles.push({
                        name: `Lista [${profileCount}]`,
                        url: cleanUrl
                    });
                    profileCount++;
                }
            }

            if (profiles.length === 0) {
                alert("Nenhuma URL válida encontrada no arquivo TXT.");
                return;
            }

            renderProfiles();
            await selectProfile(0);
        }

        function renderProfiles() {
            const profileListEl = document.getElementById('profileList');
            profileListEl.innerHTML = '';

            profiles.forEach((profile, index) => {
                let li = document.createElement('li');
                li.className = 'item';
                li.tabIndex = 0;
                li.innerText = `👤 ${profile.name}`;
                li.onclick = () => selectProfile(index);
                profileListEl.appendChild(li);
            });
        }

        async function selectProfile(index) {
            const profile = profiles[index];
            document.getElementById('currentProfileTitle').innerText = profile.name;
            document.getElementById('channelList').innerHTML = '<li class="item" tabindex="0">Baixando lista de canais...</li>';

            try {
                let response = await fetch(profile.url);
                if (!response.ok) throw new Error("Status " + response.status);
                
                let text = await response.text();
                allChannels = parseM3U(text);

                if (allChannels.length === 0) {
                    document.getElementById('channelList').innerHTML = '<li class="item" tabindex="0">A lista está vazia ou inacessível.</li>';
                    return;
                }

                processChannelsData();
            } catch (err) {
                console.warn("Tentando proxy de fallback para a URL...");
                try {
                    let proxyUrl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(profile.url);
                    let resProxy = await fetch(proxyUrl);
                    let textProxy = await resProxy.text();
                    allChannels = parseM3U(textProxy);
                    processChannelsData();
                } catch (proxyErr) {
                    document.getElementById('channelList').innerHTML = '<li class="item" tabindex="0">Erro de rede ao conectar no servidor.</li>';
                }
            }
        }

        function parseM3U(m3uContent) {
            const lines = m3uContent.split(/\r?\n/);
            const channels = [];
            let currentChannel = null;

            for (let i = 0; i < lines.length; i++) {
                let line = lines[i].trim();
                if (line.startsWith('#EXTINF:')) {
                    currentChannel = {};
                    const commaIndex = line.lastIndexOf(',');
                    currentChannel.name = commaIndex !== -1 ? line.substring(commaIndex + 1).trim() : "Canal Sem Nome";
                    const groupMatch = line.match(/group-title="([^"]*)"/);
                    currentChannel.group = groupMatch ? groupMatch[1] : 'Geral';
                } else if (line && !line.startsWith('#')) {
                    if (currentChannel) {
                        currentChannel.url = line;
                        channels.push(currentChannel);
                        currentChannel = null;
                    }
                }
            }
            return channels;
        }

        function processChannelsData() {
            groupedData = groupChannelsByCategory(allChannels);
            const categoryNames = Object.keys(groupedData);
            activeCategory = categoryNames[0] || "Todas";

            renderTabs(categoryNames);
            renderChannelsForCategory(activeCategory);
        }

        function groupChannelsByCategory(channels) {
            const categories = {};
            channels.forEach(channel => {
                const group = channel.group || "Geral";
                if (!categories[group]) categories[group] = [];
                categories[group].push(channel);
            });
            return categories;
        }

        function renderTabs(categories) {
            const tabsContainer = document.getElementById('categoryTabs');
            tabsContainer.innerHTML = '';

            categories.forEach(category => {
                let btn = document.createElement('button');
                btn.className = `tab-item ${category === activeCategory ? 'active' : ''}`;
                btn.innerText = `${category} (${groupedData[category].length})`;
                btn.tabIndex = 0;
                btn.onclick = () => {
                    activeCategory = category;
                    document.querySelectorAll('.tab-item').forEach(el => el.classList.remove('active'));
                    btn.classList.add('active');
                    renderChannelsForCategory(category);
                };
                tabsContainer.appendChild(btn);
            });
        }

        function renderChannelsForCategory(category) {
            const channelListEl = document.getElementById('channelList');
            channelListEl.innerHTML = '';

            const channels = groupedData[category] || [];
            if (channels.length === 0) {
                channelListEl.innerHTML = '<li class="item" tabindex="0">Nenhum canal nesta categoria</li>';
                return;
            }

            channels.forEach((channel) => {
                let li = document.createElement('li');
                li.className = 'item';
                li.tabIndex = 0;
                li.innerText = channel.name;
                li.onclick = () => playStream(channel.url);
                channelListEl.appendChild(li);
            });
        }

        function playStream(url) {
            const video = document.getElementById('tvPlayer');
            const placeholder = document.getElementById('placeholder');

            placeholder.style.display = 'none';
            video.style.display = 'block';

            video.src = url;
            video.play().catch(err => {
                console.error("Erro ao reproduzir stream:", err);
                alert("O player não pôde iniciar este canal.");
            });
        }

        // Navegação por setas e teclado (DPAD)
        document.addEventListener('keydown', function(event) {
            const activeElement = document.activeElement;
            const key = event.key;

            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(key
