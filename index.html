<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Android TV IPTV Launcher</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --focus-color: #00bcd4;
            --text-color: #ffffff;
            --text-secondary: #b0b0b0;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
        }

        /* Sidebar / Profiles */
        .sidebar {
            width: 300px;
            background-color: #181818;
            border-right: 2px solid #2a2a2a;
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
        }

        .sidebar h2 {
            font-size: 20px;
            margin-bottom: 20px;
            color: var(--focus-color);
        }

        .profile-list, .channel-list {
            list-style: none;
            padding: 0;
            margin: 0;
            overflow-y: auto;
            flex-grow: 1;
        }

        .item {
            padding: 12px 15px;
            margin-bottom: 8px;
            background-color: var(--card-bg);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            border: 2px solid transparent;
        }

        .item:focus, .item.selected {
            background-color: #2c2c2c;
            border-color: var(--focus-color);
            outline: none;
            transform: scale(1.02);
        }

        /* Main Content Area */
        .main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            padding: 30px;
            box-sizing: border-box;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .upload-box {
            background-color: var(--card-bg);
            padding: 10px 15px;
            border-radius: 6px;
            border: 1px dashed var(--focus-color);
            cursor: pointer;
            font-size: 13px;
        }

        .content-grid {
            display: flex;
            gap: 20px;
            flex-grow: 1;
            height: calc(100vh - 100px);
        }

        .channels-container {
            width: 350px;
            display: flex;
            flex-direction: column;
        }

        .player-container {
            flex-grow: 1;
            background-color: #000;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            border: 2px solid #2a2a2a;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .placeholder-text {
            color: var(--text-secondary);
            font-size: 18px;
        }
    </style>
</head>
<body>

    <!-- Barra Lateral: Perfites & Listas do TXT -->
    <div class="sidebar">
        <h2>Perfis IPTV</h2>
        <div style="margin-bottom: 15px;">
            <input type="file" id="txtFileLoader" accept=".txt" style="display: none;" onchange="loadTxtFile(event)">
            <button class="item" style="width: 100%; text-align: center; background-color: var(--focus-color); color: #000; font-weight: bold;" onclick="document.getElementById('txtFileLoader').click()">Carregar TXT de Listas</button>
        </div>
        <ul id="profileList" class="profile-list">
            <li class="item" tabindex="0">Nenhum perfil carregado</li>
        </ul>
    </div>

    <!-- Conteúdo Principal: Lista de Canais e Player -->
    <div class="main-content">
        <div class="header">
            <h1 id="currentProfileTitle" style="margin: 0; font-size: 24px;">Selecione um Perfil</h1>
            <div class="upload-box">GitHub TV Launcher v1.0</div>
        </div>

        <div class="content-grid">
            <!-- Lista de Canais -->
            <div class="channels-container">
                <h3 style="margin-top: 0; color: var(--text-secondary);">Canais / Streams</h3>
                <ul id="channelList" class="channel-list">
                    <li class="item" tabindex="0">Aguardando dados...</li>
                </ul>
            </div>

            <!-- Player de Vídeo -->
            <div class="player-container">
                <div id="placeholder" class="placeholder-text">Selecione um canal para reproduzir</div>
                <video id="tvPlayer" controls style="display: none;"></video>
            </div>
        </div>
    </div>

    <script>
        let profilesData = [];
        let currentChannels = [];

        // Função para processar arquivo TXT enviado pelo usuário
        function loadTxtFile(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const lines = e.target.result.split('\n');
                profilesData = [];
                let profileCount = 1;

                lines.forEach(line => {
                    line = line.trim();
                    if (!line) return;

                    let profile = { id: profileCount, name: `Perfil ${profileCount}`, type: '', url: '', server: '', user: '', pass: '' };

                    if (line.includes('|')) {
                        // Formato Xtream: Server|User|Pass
                        let parts = line.split('|');
                        profile.type = 'xtream';
                        profile.server = parts[0];
                        profile.user = parts[1];
                        profile.pass = parts[2];
                        profile.name = `Xtream [${profileCount}]`;
                    } else if (line.startsWith('http')) {
                        // Formato M3U Direto
                        profile.type = 'm3u';
                        profile.url = line;
                        profile.name = `M3U List [${profileCount}]`;
                    }

                    profilesData.push(profile);
                    profileCount++;
                });

                renderProfiles();
            };
            reader.readAsText(file);
        }

        // Renderizar Perfis na Tela
        function renderProfiles() {
            const listEl = document.getElementById('profileList');
            listEl.innerHTML = '';

            if (profilesData.length === 0) {
                listEl.innerHTML = '<li class="item">Nenhuma lista válida encontrada</li>';
                return;
            }

            profilesData.forEach((profile, index) => {
                let li = document.createElement('li');
                li.className = 'item';
                li.tabIndex = 0;
                li.innerText = profile.name;
                li.onclick = () => selectProfile(index);
                listEl.appendChild(li);
            });
        }

        // Selecionar Perfil e Simular Carregamento de Canais
        function selectProfile(index) {
            const profile = profilesData[index];
            document.getElementById('currentProfileTitle').innerText = profile.name;

            // Simulação de carregamento de canais (Se for Xtream, puxaria via API fetch)
            currentChannels = [
                { name: "Canal Exemplo 1 (HD)", streamUrl: profile.type === 'm3u' ? profile.url : `${profile.server}/live/${profile.user}/${profile.pass}/1.ts` },
                { name: "Canal Exemplo 2 (FHD)", streamUrl: profile.type === 'm3u' ? profile.url : `${profile.server}/live/${profile.user}/${profile.pass}/2.ts` }
            ];

            renderChannels();
        }

        // Renderizar Canais
        function renderChannels() {
            const channelListEl = document.getElementById('channelList');
            channelListEl.innerHTML = '';

            currentChannels.forEach((channel) => {
                let li = document.createElement('li');
                li.className = 'item';
                li.tabIndex = 0;
                li.innerText = channel.name;
                li.onclick = () => playStream(channel.streamUrl);
                channelListEl.appendChild(li);
            });
        }

        // Executar Stream no Player
        function playStream(url) {
            const video = document.getElementById('tvPlayer');
            const placeholder = document.getElementById('placeholder');

            placeholder.style.display = 'none';
            video.style.display = 'block';

            video.src = url;
            video.play().catch(err => {
                console.error("Erro ao reproduzir stream:", err);
                alert("Erro ao reproduzir o fluxo. Verifique se o servidor suporta reprodução via navegador.");
            });
        }
    </script>
</body>
</html>
